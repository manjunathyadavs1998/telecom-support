openapi: 3.1.0
info:
  title: Telecom Customer Support API — 04 Outbound assistant workspace
  version: 0.4.0
  description: |
    Status: **Draft** — Proposed (awaiting approval). Contract-first spec for slice 04 (see backend.md).
    Auth (session cookie, CSRF header) and the shared components (ProblemDetail, FieldViolation, CorrelationId,
    XsrfToken, IdempotencyKey, Problem, From, To, Page, Size) are **copied verbatim** from 01-foundation/03-inbound openapi.yaml;
    Msisdn, Severity, CaseStatus, PublicCaseStatus, CaseChannel and CaseActivity are copied from 03-inbound/openapi.yaml,
    so this file generates types on its own.
    Every `/api/v1/outbound/**` operation requires `case.read.queue` (outbound roles only) plus the permission it names.
    A case outside the caller's queue scope (backend.md §3) is 404. 409 and 422 bodies are CaseProblem with a `reason`.
    Idempotent operations hash {path variables, body}.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security:
  - session: []
tags:
  - name: Queue
    description: Case dashboard, counts and filters (OUT-01, OUT-02)
  - name: Case work
    description: Case detail, assignment, status and notes (OUT-03, OUT-04, OUT-05)
  - name: Bookmarks
    description: Personal follow-up bookmarks (OUT-06)
paths:
  /api/v1/outbound/case-summary:
    get:
      tags: [Queue]
      operationId: getQueueSummary
      summary: Queue counts by status, critical and overdue
      description: 'Permission case.read.queue. OUT-01, R1. Window on createdAt (default last 3 months); counts follow the queue scope.'
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Counts
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueSummary' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/case-searches:
    post:
      tags: [Queue]
      operationId: searchQueue
      summary: Search the case queue (server-side filters, sort and paging)
      description: 'Permission case.read.queue. OUT-01.1/01.2, OUT-02, R2. Read-only; POST keeps the customer mobile out of URLs. With no date range the created window defaults to the last 3 months; each range ≤ 366 days.'
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueSearch' }
      responses:
        '200':
          description: Page of cases with the effective filters
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundCasePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/case-categories:
    get:
      tags: [Queue]
      operationId: listQueueCategories
      summary: Active categories for the queue filter (both audiences)
      description: 'Permission case.read.queue. OUT-02, R13.'
      responses:
        '200':
          description: Categories
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueCategory' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/agents:
    get:
      tags: [Queue]
      operationId: listQueueAgents
      summary: Agents for the assignee filter and reassignment
      description: 'Permission case.read.queue. OUT-02, OUT-03, R13. Own team for agents; all queue agents for case.assign.any holders.'
      responses:
        '200':
          description: Agents
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QueueAgent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}:
    get:
      tags: [Case work]
      operationId: getOutboundCase
      summary: Case detail with customer context, timeline and allowed actions
      description: 'Permission case.read.queue. OUT-04, R4. INTERNAL activity only with case.note.internal; full contact MSISDN only for the assignee.'
      parameters:
        - $ref: '#/components/parameters/Reference'
      responses:
        '200':
          description: Case detail
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundCaseDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}/claim:
    post:
      tags: [Case work]
      operationId: claimCase
      summary: Claim an unassigned case (atomic)
      description: 'Permission case.assign. OUT-03.1, R5. Exactly one of parallel claims succeeds; others get 409 already_assigned. A retry by the owner is a 200 no-op. RESOLVED/CLOSED → 422 case_closed.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Case now owned by the caller
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundCaseDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CaseProblem' }
        '422': { $ref: '#/components/responses/CaseProblem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}/assignment:
    post:
      tags: [Case work]
      operationId: reassignCase
      summary: Assign or reassign a case to a queue agent
      description: 'Permission case.assign.any. OUT-03.2/03.3, R6. Records old owner, new owner, actor, time and reason. Stale version → 409 stale_version.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignRequest' }
      responses:
        '200':
          description: Case reassigned
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundCaseDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CaseProblem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/CaseProblem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}/status:
    post:
      tags: [Case work]
      operationId: changeCaseStatus
      summary: Move a case to another status (backend-validated transitions)
      description: 'Permission case.status.update; caller must be the assignee or hold case.assign.any (else 403). OUT-05, R7–R9, backend.md §3.1. Remarks required for RESOLVED, REOPENED and CLOSED with CUSTOMER_CONFIRMED.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChangeRequest' }
      responses:
        '200':
          description: Status changed
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutboundCaseDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/CaseProblem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/CaseProblem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}/notes:
    post:
      tags: [Case work]
      operationId: addCaseNote
      summary: Add an internal note or a customer-visible comment
      description: 'Permission case.read.queue, idempotent (operation CASE_NOTE_ADD). OUT-04.1/04.3, R10. INTERNAL needs case.note.internal; PUBLIC needs case.status.update and assignee or case.assign.any; PUBLIC on CLOSED → 422 case_closed.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteRequest' }
      responses:
        '201':
          description: Note added
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseActivity' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/CaseProblem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/cases/{reference}/bookmark:
    put:
      tags: [Bookmarks]
      operationId: bookmarkCase
      summary: Bookmark a case for personal follow-up (idempotent)
      description: 'Permission case.bookmark. OUT-06.1, R11. Case must be in the queue scope. Max 200 per agent → 422 bookmark_limit. Ownership is not changed.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Bookmarked
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/CaseProblem' }
        '500': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Bookmarks]
      operationId: unbookmarkCase
      summary: Remove the caller's bookmark (idempotent)
      description: 'Permission case.bookmark. OUT-06.1, R11. 204 even if not bookmarked; unknown reference → 404.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Not bookmarked
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/bookmarks:
    get:
      tags: [Bookmarks]
      operationId: listBookmarks
      summary: The caller's bookmarked cases, newest bookmark first
      description: 'Permission case.bookmark. OUT-06.2–06.4, R12. No date window (bounded by the 200 cap). Cases no longer in scope are reference-only (accessible=false).'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of bookmarks
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookmarkPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/outbound/bookmarks/{reference}/seen:
    post:
      tags: [Bookmarks]
      operationId: markBookmarkSeen
      summary: Mark a bookmarked case as seen (clears its changed flag)
      description: 'Permission case.bookmark. OUT-06.4, R12. 404 when the caller has not bookmarked the case.'
      parameters:
        - $ref: '#/components/parameters/Reference'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: Seen
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
  headers:
    CorrelationId:
      description: Request correlation id (echoed if valid, otherwise generated)
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: Current value of the XSRF-TOKEN cookie, read by the SPA before each mutating request (no masking)
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key, reused on retries of the same request (00-overview §7)
      schema: { type: string, minLength: 1, maxLength: 100 }
    Reference:
      name: reference
      in: path
      required: true
      description: Case reference (BR-01)
      schema: { type: string, pattern: '^SR-\d{8}-\d{6}$', examples: [SR-20261128-000042] }
    From:
      name: from
      in: query
      description: 'Inclusive start date (Asia/Kolkata). Default is the to date minus 3 months. Range ≤ 366 days.'
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      description: Inclusive end date (Asia/Kolkata). Default today.
      schema: { type: string, format: date }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Problem:
      description: Error (RFC 7807), see 00-overview.md §4.
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    CaseProblem:
      description: Case rule or concurrency conflict (409 conflict / 422 business-rule) with a machine-readable reason
      headers:
        X-Correlation-Id: { $ref: '#/components/headers/CorrelationId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/CaseProblem' }
  schemas:
    Msisdn:
      type: string
      description: E.164 mobile number
      pattern: '^\+[1-9]\d{7,14}$'
      examples: ['+919800000001']
    Severity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    CaseStatus:
      type: string
      description: Internal case status (BRD §7.1)
      enum: [CREATED, ASSIGNED, IN_PROGRESS, PENDING_CUSTOMER, PENDING_EXTERNAL, RESOLVED, CLOSED, REOPENED]
    PublicCaseStatus:
      type: string
      enum: [SUBMITTED, IN_PROGRESS, AWAITING_YOUR_REPLY, RESOLVED, CLOSED]
    CaseChannel:
      type: string
      enum: [CUSTOMER_PORTAL, INBOUND_AGENT]
    ClosureType:
      type: string
      description: 'How closure conditions were met (OUT-05.4, R8)'
      enum: [CUSTOMER_CONFIRMED, WINDOW_ELAPSED]
    DateWindow:
      type: object
      required: [from, to]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
    QueueSummary:
      type: object
      required: [window, new, open, inProgress, pending, resolved, closed, critical, overdue]
      properties:
        window: { $ref: '#/components/schemas/DateWindow' }
        new: { type: integer, format: int64, description: CREATED }
        open: { type: integer, format: int64, description: ASSIGNED + REOPENED }
        inProgress: { type: integer, format: int64 }
        pending: { type: integer, format: int64, description: PENDING_CUSTOMER + PENDING_EXTERNAL }
        resolved: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
        critical: { type: integer, format: int64, description: 'CRITICAL, not RESOLVED/CLOSED' }
        overdue: { type: integer, format: int64, description: 'SLA due in the past, not RESOLVED/CLOSED' }
    AssigneeFilter:
      type: string
      description: 'USER needs assigneeUserId'
      enum: [ANY, ME, UNASSIGNED, USER]
    QueueSort:
      type: string
      enum: ['createdAt,desc', 'createdAt,asc', 'updatedAt,desc', 'updatedAt,asc', 'slaDueAt,asc', 'slaDueAt,desc', 'severity,desc', 'severity,asc']
    QueueSearch:
      type: object
      properties:
        createdFrom: { type: [string, 'null'], format: date }
        createdTo: { type: [string, 'null'], format: date }
        updatedFrom: { type: [string, 'null'], format: date }
        updatedTo: { type: [string, 'null'], format: date }
        status:
          type: array
          items: { $ref: '#/components/schemas/CaseStatus' }
        severity:
          type: array
          items: { $ref: '#/components/schemas/Severity' }
        categoryCode: { type: [string, 'null'], maxLength: 32 }
        assignee: { $ref: '#/components/schemas/AssigneeFilter' }
        assigneeUserId: { type: [integer, 'null'], format: int64 }
        customerMsisdn:
          oneOf:
            - $ref: '#/components/schemas/Msisdn'
            - type: 'null'
        reference: { type: [string, 'null'], maxLength: 24 }
        overdue: { type: boolean, default: false }
        page: { type: integer, minimum: 0, default: 0 }
        size: { type: integer, minimum: 1, maximum: 100, default: 20 }
        sort: { $ref: '#/components/schemas/QueueSort' }
    AppliedFilters:
      type: object
      description: 'The effective filters, including the default created window when no range was given (OUT-02.2)'
      required: [created, sort]
      properties:
        created:
          oneOf:
            - $ref: '#/components/schemas/DateWindow'
            - type: 'null'
        updated:
          oneOf:
            - $ref: '#/components/schemas/DateWindow'
            - type: 'null'
        sort: { $ref: '#/components/schemas/QueueSort' }
    CaseCustomer:
      type: object
      required: [customerRef, customerName, accountRef, maskedMsisdn]
      properties:
        customerRef: { type: string }
        customerName: { type: string }
        accountRef: { type: string }
        maskedMsisdn: { type: string, description: 'Contact MSISDN, last 4 digits only', examples: ['******0001'] }
    OutboundCaseSummary:
      type: object
      required: [reference, customer, categoryName, severity, status, publicStatus, createdAt, updatedAt, overdue, bookmarked]
      properties:
        reference: { type: string, examples: [SR-20261128-000042] }
        customer: { $ref: '#/components/schemas/CaseCustomer' }
        categoryName: { type: string }
        subcategoryName: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        publicStatus: { $ref: '#/components/schemas/PublicCaseStatus' }
        assignedUserId: { type: [integer, 'null'], format: int64 }
        ownerName: { type: [string, 'null'], description: 'Assigned user, else team, else null (unassigned)' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        slaDueAt: { type: string, format: date-time }
        overdue: { type: boolean }
        bookmarked: { type: boolean }
    OutboundCasePage:
      type: object
      required: [items, page, size, totalItems, totalPages, filters]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OutboundCaseSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
        filters: { $ref: '#/components/schemas/AppliedFilters' }
    QueueCategory:
      type: object
      required: [code, name, audience, children]
      properties:
        code: { type: string }
        name: { type: string }
        audience: { type: string, enum: [CUSTOMER, INTERNAL] }
        children:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string }
              name: { type: string }
    QueueAgent:
      type: object
      required: [userId, displayName]
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        teamId: { type: [integer, 'null'], format: int64 }
        teamName: { type: [string, 'null'] }
    CaseActivity:
      type: object
      required: [type, visibility, at]
      properties:
        type: { type: string, enum: [CREATED, STATUS_CHANGED, ASSIGNED, NOTE] }
        visibility: { type: string, enum: [PUBLIC, INTERNAL] }
        actorName: { type: [string, 'null'] }
        oldValue: { type: [string, 'null'] }
        newValue: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        at: { type: string, format: date-time }
    AllowedActions:
      type: object
      description: 'What the caller may do now (CaseLifecycle, R4); the backend re-checks every action'
      required: [claim, reassign, transitions, internalNote, publicComment]
      properties:
        claim: { type: boolean }
        reassign: { type: boolean }
        transitions:
          type: array
          items: { $ref: '#/components/schemas/CaseStatus' }
        internalNote: { type: boolean }
        publicComment: { type: boolean }
    OutboundCaseDetail:
      type: object
      required: [reference, version, customer, accountStatus, categoryName, caseType, channel, creatorName, subject, description,
                 severity, status, publicStatus, preferredContact, createdAt, updatedAt, responseDueAt, slaDueAt, overdue,
                 bookmarked, activity, allowedActions]
      properties:
        reference: { type: string }
        version: { type: integer, description: 'Send back on reassign and status change (optimistic check)' }
        customer: { $ref: '#/components/schemas/CaseCustomer' }
        accountStatus: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        contactMsisdn:
          description: 'Full contact number, only for the assignee; otherwise null (OUT-04.4)'
          oneOf:
            - $ref: '#/components/schemas/Msisdn'
            - type: 'null'
        preferredContact: { type: string, enum: [PHONE, SMS, EMAIL] }
        categoryName: { type: string }
        subcategoryName: { type: [string, 'null'] }
        caseType: { type: string, enum: [REQUEST, COMPLAINT] }
        channel: { $ref: '#/components/schemas/CaseChannel' }
        creatorName: { type: string, description: 'Who created the request (OUT-04.2)' }
        subject: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        publicStatus: { $ref: '#/components/schemas/PublicCaseStatus' }
        assignedUserId: { type: [integer, 'null'], format: int64 }
        assigneeName: { type: [string, 'null'] }
        teamName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        responseDueAt: { type: string, format: date-time }
        slaDueAt: { type: string, format: date-time }
        overdue: { type: boolean }
        resolvedAt: { type: [string, 'null'], format: date-time }
        resolvedByName: { type: [string, 'null'] }
        resolutionRemarks: { type: [string, 'null'] }
        closedAt: { type: [string, 'null'], format: date-time }
        closureType:
          oneOf:
            - $ref: '#/components/schemas/ClosureType'
            - type: 'null'
        reopenCount: { type: integer, minimum: 0 }
        bookmarked: { type: boolean }
        activity:
          type: array
          description: Oldest first; INTERNAL entries only with case.note.internal
          items: { $ref: '#/components/schemas/CaseActivity' }
        allowedActions: { $ref: '#/components/schemas/AllowedActions' }
    ReassignRequest:
      type: object
      required: [assigneeUserId, reason, version]
      properties:
        assigneeUserId: { type: integer, format: int64 }
        reason: { type: string, minLength: 5, maxLength: 500 }
        version: { type: integer }
    StatusChangeRequest:
      type: object
      required: [toStatus, version]
      properties:
        toStatus: { $ref: '#/components/schemas/CaseStatus' }
        remarks: { type: [string, 'null'], maxLength: 1000, description: 'Required (10–1000) for RESOLVED, REOPENED and CLOSED with CUSTOMER_CONFIRMED' }
        closureType:
          description: Required when toStatus is CLOSED
          oneOf:
            - $ref: '#/components/schemas/ClosureType'
            - type: 'null'
        version: { type: integer }
    NoteRequest:
      type: object
      required: [visibility, text]
      properties:
        visibility: { type: string, enum: [PUBLIC, INTERNAL] }
        text: { type: string, minLength: 1, maxLength: 2000 }
    Bookmark:
      type: object
      required: [reference, bookmarkedAt, accessible, changed]
      properties:
        reference: { type: string }
        bookmarkedAt: { type: string, format: date-time }
        accessible: { type: boolean, description: 'false when the case left the caller''s queue scope; only the reference is returned' }
        changed: { type: boolean, description: 'Updated since the caller last saw it (OUT-06.4)' }
        case:
          oneOf:
            - $ref: '#/components/schemas/OutboundCaseSummary'
            - type: 'null'
    BookmarkPage:
      type: object
      required: [items, page, size, totalItems, totalPages, changedCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bookmark' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
        changedCount: { type: integer, format: int64 }
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ProblemDetail:
      type: object
      required: [type, title, status, correlationId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlationId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
    CaseProblem:
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            reason:
              type: string
              enum: [already_assigned, stale_version, case_closed, unassigned, invalid_transition, invalid_assignee, no_change,
                     closure_condition_unmet, reopen_window_expired, bookmark_limit]
