spring:
  application:
    name: telecom-support
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/telecom_support?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:telecom_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never   # created by Flyway V2
      cleanup-cron: "0 */5 * * * *"
    timeout: 30m

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  display-time-zone: Asia/Kolkata
  security:
    api-docs-public: false
    login-attempts-per-minute: 10
    max-failed-logins: 5
    lock-minutes: 15
