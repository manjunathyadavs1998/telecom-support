spring:
  application:
    name: telecom-support
  autoconfigure:
    # no generated in-memory user (its password would be logged); real users come from AppUserDetailsService (B7)
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never   # SPRING_SESSION tables come from Flyway V2
      cleanup-cron: "0 */5 * * * *"
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  # forwarded headers are applied only by TrustedProxyFilter, for app.security.trusted-proxies (01 backend §4.4);
  # 'none' stops Tomcat (native) and Spring Boot (framework) from applying them for any caller
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:            # API docs only in the dev profile (01 backend §4.3)
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

app:
  web:
    max-request-size: 1MB   # larger @RequestBody payloads get 413 payload-too-large
  display-time-zone: Asia/Kolkata
  customer:
    otp:                          # contact verification (02 backend R3, §3.2, §6)
      ttl: 10m
      max-attempts: 5
      starts-per-hour: 5          # per customer per rolling hour -> 429
      hmac-secret: ${OTP_HMAC_SECRET:}   # blank = random per-process key (dev/test only; ProfileGuard refuses it in prod)
      dev-fixed-code: ""          # set only in dev; ProfileGuard refuses it with prod
    plan-change:
      apply-cron: "0 5 0 * * *"   # daily 00:05 in app.display-time-zone (02 backend R6)
  payment:                        # hosted payment gateway (02 backend §6, §8, §3.1)
    return-url-base: ${PAYMENT_RETURN_URL_BASE:http://localhost:${server.port:8080}}   # SPA origin; E15 returnUrl = base + /customer/payments/{ref} (E4); required in prod
    gateway:
      timeout: 5s                 # client timeout; past it the outcome is unknown and reconciled by reference
      webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}   # HMAC key of X-Gateway-Signature; blank = random per-process key (refused in prod)
      signature-tolerance: 5m
      session-ttl: 15m
      late-capture-window: 24h
    webhook:
      ip-requests-per-minute: 60
    reconcile:                    # PaymentReconciliationJob (02 backend §3.1); "-" disables a schedule
      pending-cron: "0 * * * * *"         # every 60 s: PENDING older than 2 min
      late-capture-cron: "0 */15 * * * *" # every 15 min: FAILED/EXPIRED completed within late-capture-window
    mock:
      enabled: false              # mock checkout page (dev/test only)
      mode: NORMAL                # NORMAL | UNAVAILABLE | TIMEOUT
      webhook-url: http://localhost:${server.port:8080}/api/v1/payment-gateway/webhooks
  session:
    absolute-timeout: 12h
  idempotency:
    stale-after: 2m              # IN_PROGRESS keys older than this are reclaimed (01 backend §6.1)
    purge-cron: "0 0 * * * *"    # hourly purge of keys older than 24 h
  security:
    trusted-proxies: []   # CIDR list; empty = ignore X-Forwarded-* and use the remote address
    cookie-secure: false  # true (prod profile) = XSRF-TOKEN always Secure; false = Secure only over HTTPS
    login:                # login throttling (01 backend §4.1, §12 E2.3); these are the approved defaults
      ip-attempts-per-minute: 20              # L1: attempts per client IP per minute -> 429
      pair-max-failures: 5                    # L2: failures of one (IP, username) within 15 min -> pair blocked
      pair-block: 15m                         # L2: block duration
      username-anomaly-failures-per-hour: 50  # L3: failures per username per rolling hour -> LOGIN_ANOMALY audit
