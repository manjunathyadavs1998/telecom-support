spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  customer:
    otp:
      dev-fixed-code: "123456"    # in-memory OTP sender in dev (02 backend §8, OQ 11); refused with prod by ProfileGuard
  payment:
    return-url-base: http://localhost:5173   # SPA origin in local dev (01 frontend §9); E15 builds returnUrl from it
    mock:
      enabled: true               # mock checkout page /mock-gateway/checkout/{sessionId}; refused with prod by ProfileGuard
  notification:
    mock:
      enabled: true               # in-memory notification sender (03 backend §8, OQ 9); refused with prod by ProfileGuard
